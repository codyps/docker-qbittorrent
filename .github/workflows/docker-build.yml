name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh Debian packages daily, even when this repository has no commits.
    - cron: '17 6 * * *'

# Serialize publication so an older build cannot overwrite a newer one.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Bound the whole job, including action setup and cleanup.
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        timeout-minutes: 2
        uses: actions/checkout@v7

      - name: Set up QEMU
        timeout-minutes: 3
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        timeout-minutes: 3
        uses: docker/setup-buildx-action@v4

      - name: Build image for startup tests
        timeout-minutes: 10
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/qbittorrent:test
          pull: true
          no-cache: true

      - name: Test qBittorrent version and WebUI startup
        timeout-minutes: 2
        run: bash .github/scripts/smoke-test.sh local/qbittorrent:test

      - name: Log in to GitHub Container Registry
        timeout-minutes: 2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        timeout-minutes: 1
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A cached apt-get layer can hide newly published qBittorrent packages.
          pull: true
          no-cache: true

      - name: Record published image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published ${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build tag: build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
